[package]
name = "z-lending-eligibility"
version = "0.1.0"
edition = "2021"

# cdylib is what makes wasm32-wasip2 emit a WASM *component* rather than a bare
# core module; "lib" keeps the decision logic unit-testable natively.
[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
wit-bindgen = { version = "0.49", default-features = false, features = ["macros", "realloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
