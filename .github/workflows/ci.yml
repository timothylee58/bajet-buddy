name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Show environment
        run: node --version && npm --version
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint -w @bajetbuddy/web
        working-directory: .
      - name: Build
        run: npm run build -w @bajetbuddy/web
        working-directory: .
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: "--max-old-space-size=4096"

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff
        # The rule set lives in apps/api/ruff.toml, so a new ruff release can no
        # longer expand it silently — the pin this replaces is no longer needed.
        run: pip install ruff && ruff check app
      - name: Import smoke test
        run: python -c "from app.main import app; assert app.title"
